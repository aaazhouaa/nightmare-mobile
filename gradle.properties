# JVM settings sized for this phone (14Gi RAM). ~/.gradle/gradle.properties
# used to override this file and pin -Xmx1024m/SerialGC/2 workers, which made
# assembleRelease swap for 6m28s; as of 2026-09 the global file only sets
# android.aapt2FromMavenOverride, so these values now take effect.
# tools/assemble-release.sh still launches its own JVM with the same numbers
# and --no-daemon, which is the reliable path on device.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
