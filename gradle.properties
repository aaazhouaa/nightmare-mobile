# ⚠ These values are what a desktop clone should use. On TaiXu they do NOT
# take effect: ~/.gradle/gradle.properties overrides this file and pins
# -Xmx1024m, SerialGC, 2 workers, kotlin daemon 512m. That combination made
# assembleRelease swap for 6m28s and look like a 360s client timeout.
# Release builds on this phone MUST go through tools/assemble-release.sh,
# which launches the JVM with -Xmx2048m / ParallelGC / 4 workers itself.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
